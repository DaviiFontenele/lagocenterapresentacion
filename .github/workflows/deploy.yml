name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # Dispara em todo push para o branch main
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build do projeto (Vite)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato de build
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
