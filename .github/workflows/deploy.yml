name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # Dispara em todo push para o branch main
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

permissions:
  contents: write  # Necessario para publicar no branch gh-pages

# Garante que apenas um deploy rode por vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Build do projeto (Vite)
        run: npm run build

      - name: Deploy para branch gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist        # Pasta gerada pelo Vite
          branch: gh-pages    # Branch dedicado para o site publicado
          clean: true         # Remove arquivos antigos automaticamente
